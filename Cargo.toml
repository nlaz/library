[workspace]
resolver = "3"
members = [
    "fold",
    "anny",
    "ese",
    "examples/*",
    "tools/librarian-eval",
    "tools/retrieval-eval",
    "apps/library-core",
    "apps/library-ingest",
    "apps/library-server",
    "apps/library-app",
]

[workspace.package]
edition = "2024"
# truthful floor: fold uses APIs stabilized in 1.93 (clippy enforces this
# via incompatible_msrv); CI pins the actual toolchain in rust-toolchain.toml
rust-version = "1.93"

# Shared lint policy (see AGENTS.md). Members opt in with [lints]
# workspace = true; examples/* and tools stay unlinted demo code.
# unwrap_used: audited crates only — survivors carry #[expect] + an
# // invariant: comment; tests are exempt via clippy.toml.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# fold's statically-composed pipelines put the whole graph in the type;
# nested generics are the design, not an accident (see Graph in
# library-core::store)
type_complexity = "allow"

[workspace.dependencies]
fold = { path = "fold" }
anny = { path = "anny" }
ese = { path = "ese", features = ["dim-512", "quant-8", "rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fxhash = "0"
postcard = { version = "1", features = ["use-std"] }
fjall = { version = "3", default-features = false }
anyhow = "1"

# hoisted from fold; applies workspace-wide
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

# dependencies don't need debuginfo — nobody steps through tauri or
# tokenizers in lldb, and full DWARF for ~600 dep crates is the bulk of a
# multi-GB target/debug. "*" excludes workspace members, which keep full
# debuginfo. Backtraces through deps still show symbol names.
[profile.dev.package."*"]
debug = false

# the search/store hot path runs at near-release speed inside `cargo tauri
# dev` and debug test runs — BM25 over a full library is 10-40x slower
# unoptimized, which reads as an app hang
[profile.dev.package.fold]
opt-level = 2
[profile.dev.package.library-core]
opt-level = 2
[profile.dev.package.anny]
opt-level = 2
[profile.dev.package.ese]
opt-level = 2
[profile.dev.package.fjall]
opt-level = 2
[profile.dev.package.lsm-tree]
opt-level = 2
[profile.dev.package.byteview]
opt-level = 2
[profile.dev.package.postcard]
opt-level = 2
[profile.dev.package.fxhash]
opt-level = 2
# the brute-force cosine ranking in the eval tool is a dense matmul
[profile.dev.package.retrieval-eval]
opt-level = 2

# hoisted from anny
[profile.bench]
lto = "fat"
codegen-units = 1
