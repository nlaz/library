<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Library</title>
    <link rel="preload" href="/fonts/instrument-sans-vf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <header>
      <nav id="cols" role="group" title="Collections"></nav>
      <button id="notes-toggle" class="divot" title="Notes" aria-label="Notes" aria-pressed="false">
        <!-- tabbed index card in the same 2×2 Bayer 50% tile as its
             neighbours: tab, frame, one rule — all currentColor. The tab is
             what keeps it from reading as a generic document; it says
             catalogue, which is the register this whole app is in. Every
             limb is 2px on the integer grid so the tile never breaks. -->
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <defs>
            <pattern id="notes-card-dither" width="2" height="2" patternUnits="userSpaceOnUse">
              <rect width="1" height="1" fill="currentColor" />
              <rect x="1" y="1" width="1" height="1" fill="currentColor" />
            </pattern>
          </defs>
          <g shape-rendering="crispEdges" fill="url(#notes-card-dither)">
            <rect x="1" y="0" width="6" height="2" />
            <rect x="1" y="2" width="14" height="2" />
            <rect x="1" y="2" width="2" height="12" />
            <rect x="13" y="2" width="2" height="12" />
            <rect x="1" y="12" width="14" height="2" />
            <rect x="4" y="7" width="8" height="2" />
          </g>
        </svg>
      </button>
      <button id="chat-toggle" class="divot" title="Ask the librarian" aria-label="Ask the librarian">
        <!-- chamfered speech bubble with a tail, filled with the 2×2 Bayer
             50% tile from tokens.css §2, in currentColor so it follows --ink
             across themes. The corners are dropped rather than curved — a
             radius here would land off the grid and fray the tile, exactly
             what the old diagonal star burst did. The tail is the only
             asymmetry in the header trio, which is what makes it findable. -->
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <defs>
            <pattern id="chat-bubble-dither" width="2" height="2" patternUnits="userSpaceOnUse">
              <rect width="1" height="1" fill="currentColor" />
              <rect x="1" y="1" width="1" height="1" fill="currentColor" />
            </pattern>
          </defs>
          <g shape-rendering="crispEdges" fill="url(#chat-bubble-dither)">
            <rect x="2" y="0" width="12" height="2" />
            <rect x="0" y="2" width="2" height="8" />
            <rect x="14" y="2" width="2" height="8" />
            <rect x="2" y="10" width="12" height="2" />
            <rect x="4" y="12" width="4" height="2" />
            <rect x="4" y="14" width="2" height="2" />
          </g>
        </svg>
      </button>
    </header>
    <main>
      <div id="home"></div>
      <div id="search" hidden>
        <div id="stats"></div>
        <div id="results"></div>
        <div id="more" hidden></div>
      </div>
    </main>
    <section id="reader" hidden>
      <div id="reader-top">
        <button id="reader-back" class="divot" title="Back (Esc)">←</button>
        <div id="reader-title"></div>
        <div id="reader-pageno"></div>
        <button id="reader-pen" class="divot" title="Markup mode (⌘U)" aria-pressed="false">✎</button>
        <button id="reader-meta" class="divot" title="Document info">ⓘ</button>
      </div>
      <div id="reader-body">
        <div id="reader-scroll">
          <div id="reader-pages"></div>
        </div>
        <div id="reader-ticks"></div>
        <div id="reader-aticks"></div>
        <aside id="reader-drawer" hidden></aside>
      </div>
    </section>
    <section id="notes" hidden>
      <div id="notes-body"></div>
    </section>
    <section id="sheet" hidden>
      <div id="sheet-top">
        <button id="sheet-back" class="divot quiet">← notes</button>
        <span id="sheet-state"></span>
      </div>
      <div id="sheet-scroll">
        <div id="sheet-col">
          <div id="sheet-date"></div>
          <input id="sheet-title" type="text" placeholder="a title, if it wants one" autocomplete="off" />
          <textarea id="sheet-body" rows="6" placeholder="write… ([[ links a note)"></textarea>
          <ul id="sheet-ac" hidden></ul>
          <button id="sheet-whisper" hidden>this is becoming an essay · split?</button>
          <div id="sheet-evidence"></div>
        </div>
      </div>
      <div id="sheet-foot">
        <button id="sheet-file" class="divot quiet" hidden>file away</button>
        <button id="sheet-keep" class="divot raise accent">keep</button>
      </div>
    </section>
    <div id="overlay" hidden>
      <aside id="viewer">
        <div id="viewer-top">
          <div id="viewer-label"></div>
          <div class="viewer-actions">
            <button id="viewer-read" class="divot raise accent">Open in reader</button>
            <button id="viewer-close" class="divot" title="Close (Esc)">✕</button>
          </div>
        </div>
        <div id="page-wrap">
          <img id="page-img" alt="" />
          <div id="page-hl"></div>
        </div>
      </aside>
    </div>
    <div id="dropzone" hidden>
      <div class="dz-inner">Drop PDFs to add them to the library</div>
    </div>
    <div id="search-pop" hidden>
      <div id="q-wrap">
        <input id="q" type="search" placeholder="Search the library…" autocomplete="off" />
        <!-- inline completion. The two spans MUST stay on one line: #q-ghost
             is white-space: pre, so a newline between them renders as a space
             and shifts every suggestion to the right. -->
        <div id="q-ghost" aria-hidden="true"><span id="q-typed"></span><span id="q-tail"></span></div>
      </div>
      <div id="search-nav" hidden>
        <span id="search-count"></span>
        <button id="search-prev" class="divot" title="Previous match (Shift+Enter)">↑</button>
        <button id="search-next" class="divot" title="Next match (Enter)">↓</button>
      </div>
    </div>
    <aside id="chat" hidden aria-label="Librarian chat">
      <div id="chat-top">
        <span>librarian</span>
        <div class="chat-actions">
          <button id="chat-stop" class="divot" title="Stop generating" hidden>stop</button>
          <button id="chat-clear" class="divot" title="Clear conversation">clear</button>
          <button id="chat-close" class="divot" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="ask the library…" autocomplete="off" />
      </form>
    </aside>
    <section id="perf" hidden aria-label="Performance">
      <div id="perf-head">
        <div id="perf-id"></div>
        <nav id="perf-tabs" role="tablist" aria-label="Perf sections">
          <button data-tab="search" role="tab" aria-selected="true" class="divot quiet on" aria-controls="perf-search-body">
            search<span class="n"></span>
          </button>
          <button data-tab="ingest" class="divot quiet" role="tab" aria-selected="false" aria-controls="perf-ingest-body">
            ingest<span class="n"></span>
          </button>
          <button data-tab="agent" class="divot quiet" role="tab" aria-selected="false" aria-controls="perf-agent-body">
            agent<span class="n"></span>
          </button>
          <button data-tab="memory" class="divot quiet" role="tab" aria-selected="false" aria-controls="perf-memory-body">
            memory<span class="n"></span>
          </button>
        </nav>
        <div id="perf-facts"></div>
      </div>
      <div id="perf-search-body" class="perf-pane" role="tabpanel"></div>
      <div id="perf-ingest-body" class="perf-pane" role="tabpanel" hidden></div>
      <div id="perf-agent-body" class="perf-pane" role="tabpanel" hidden></div>
      <div id="perf-memory-body" class="perf-pane" role="tabpanel" hidden></div>
      <div id="perf-pop" hidden></div>
    </section>
    <section id="atlas" hidden aria-label="Corpus atlas">
      <div id="atlas-head">
        <div id="atlas-title">corpus atlas</div>
        <div id="atlas-status"></div>
        <button id="atlas-refresh" class="divot" title="Recompute the atlas">rebuild</button>
      </div>
      <div id="atlas-body">
        <aside id="atlas-rail" aria-label="Recurring themes"></aside>
        <div id="atlas-stage">
          <canvas id="atlas-map"></canvas>
          <div id="atlas-note">
            brightness — how many books a passage's neighbors span
          </div>
          <div id="atlas-tip" hidden></div>
        </div>
        <aside id="atlas-panel" hidden aria-label="Theme detail"></aside>
      </div>
    </section>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
