<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>The Library</title>
    <link rel="preload" href="/fonts/instrument-sans-vf.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <header>
      <nav id="cols" role="group" title="Collections"></nav>
      <button id="notes-toggle" title="Notes" aria-label="Notes">
        <!-- typewriter in the same 2×2 Bayer 50% tile as the chat burst:
             paper, carriage, body, feet — all currentColor -->
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <defs>
            <pattern id="notes-type-dither" width="2" height="2" patternUnits="userSpaceOnUse">
              <rect width="1" height="1" fill="currentColor" />
              <rect x="1" y="1" width="1" height="1" fill="currentColor" />
            </pattern>
          </defs>
          <g shape-rendering="crispEdges" fill="url(#notes-type-dither)">
            <rect x="5" y="0" width="6" height="4" />
            <rect x="2" y="4" width="12" height="3" />
            <rect x="0" y="4" width="2" height="2" />
            <rect x="14" y="4" width="2" height="2" />
            <rect x="1" y="8" width="14" height="6" />
            <rect x="2" y="14" width="3" height="2" />
            <rect x="11" y="14" width="3" height="2" />
          </g>
        </svg>
      </button>
      <button id="chat-toggle" title="Ask the librarian" aria-label="Ask the librarian">
        <!-- star burst filled with the 2×2 Bayer 50% tile from tokens.css §2,
             in currentColor so it follows --ink across themes -->
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <defs>
            <pattern id="chat-burst-dither" width="2" height="2" patternUnits="userSpaceOnUse">
              <rect width="1" height="1" fill="currentColor" />
              <rect x="1" y="1" width="1" height="1" fill="currentColor" />
            </pattern>
          </defs>
          <path
            shape-rendering="crispEdges"
            fill="url(#chat-burst-dither)"
            d="M8 0 L9.5 5.4 L13.7 2.3 L10.6 6.5 L16 8 L10.6 9.5 L13.7 13.7 L9.5 10.6 L8 16 L6.5 10.6 L2.3 13.7 L5.4 9.5 L0 8 L5.4 6.5 L2.3 2.3 L6.5 5.4 Z"
          />
        </svg>
      </button>
    </header>
    <main>
      <div id="home"></div>
      <div id="search" hidden>
        <div id="stats"></div>
        <div id="results"></div>
        <div id="more" hidden></div>
      </div>
    </main>
    <section id="reader" hidden>
      <div id="reader-top">
        <button id="reader-back" title="Back (Esc)">←</button>
        <div id="reader-title"></div>
        <div id="reader-pageno"></div>
        <button id="reader-pen" title="Markup mode (⌘U)">✎</button>
        <button id="reader-meta" title="Document info">ⓘ</button>
      </div>
      <div id="reader-body">
        <div id="reader-scroll">
          <div id="reader-pages"></div>
        </div>
        <div id="reader-ticks"></div>
        <div id="reader-aticks"></div>
        <aside id="reader-drawer" hidden></aside>
      </div>
    </section>
    <section id="notes" hidden>
      <div id="notes-body"></div>
    </section>
    <section id="sheet" hidden>
      <div id="sheet-top">
        <button id="sheet-back">← notes</button>
        <span id="sheet-state"></span>
      </div>
      <div id="sheet-scroll">
        <div id="sheet-col">
          <div id="sheet-date"></div>
          <input id="sheet-title" type="text" placeholder="a title, if it wants one" autocomplete="off" />
          <textarea id="sheet-body" rows="6" placeholder="write… ([[ links a note)"></textarea>
          <ul id="sheet-ac" hidden></ul>
          <button id="sheet-whisper" hidden>this is becoming an essay · split?</button>
          <div id="sheet-evidence"></div>
        </div>
      </div>
      <div id="sheet-foot">
        <button id="sheet-file" hidden>file away</button>
        <button id="sheet-keep">keep</button>
      </div>
    </section>
    <div id="overlay" hidden>
      <aside id="viewer">
        <div id="viewer-top">
          <div id="viewer-label"></div>
          <div class="viewer-actions">
            <button id="viewer-read">Open in reader</button>
            <button id="viewer-close" title="Close (Esc)">✕</button>
          </div>
        </div>
        <div id="page-wrap">
          <img id="page-img" alt="" />
          <div id="page-hl"></div>
        </div>
      </aside>
    </div>
    <div id="dropzone" hidden>
      <div class="dz-inner">Drop PDFs to add them to the library</div>
    </div>
    <div id="search-pop" hidden>
      <input id="q" type="search" placeholder="Search the library…" autocomplete="off" />
      <ul id="ac" hidden></ul>
      <div id="search-nav" hidden>
        <span id="search-count"></span>
        <button id="search-prev" title="Previous match (Shift+Enter)">↑</button>
        <button id="search-next" title="Next match (Enter)">↓</button>
      </div>
    </div>
    <aside id="chat" hidden aria-label="Librarian chat">
      <div id="chat-top">
        <span>librarian</span>
        <div class="chat-actions">
          <button id="chat-stop" title="Stop generating" hidden>stop</button>
          <button id="chat-clear" title="Clear conversation">clear</button>
          <button id="chat-close" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="ask the library…" autocomplete="off" />
      </form>
    </aside>
    <section id="perf" hidden aria-label="Performance">
      <div id="perf-head">
        <div id="perf-id"></div>
        <nav id="perf-tabs" role="tablist" aria-label="Perf sections">
          <button data-tab="search" role="tab" aria-selected="true" class="on" aria-controls="perf-search-body">
            search<span class="n"></span>
          </button>
          <button data-tab="ingest" role="tab" aria-selected="false" aria-controls="perf-ingest-body">
            ingest<span class="n"></span>
          </button>
          <button data-tab="agent" role="tab" aria-selected="false" aria-controls="perf-agent-body">
            agent<span class="n"></span>
          </button>
          <button data-tab="memory" role="tab" aria-selected="false" aria-controls="perf-memory-body">
            memory<span class="n"></span>
          </button>
        </nav>
        <div id="perf-facts"></div>
      </div>
      <div id="perf-search-body" class="perf-pane" role="tabpanel"></div>
      <div id="perf-ingest-body" class="perf-pane" role="tabpanel" hidden></div>
      <div id="perf-agent-body" class="perf-pane" role="tabpanel" hidden></div>
      <div id="perf-memory-body" class="perf-pane" role="tabpanel" hidden></div>
      <div id="perf-pop" hidden></div>
    </section>
    <section id="atlas" hidden aria-label="Corpus atlas">
      <div id="atlas-head">
        <div id="atlas-title">corpus atlas</div>
        <div id="atlas-status"></div>
        <button id="atlas-refresh" title="Recompute the atlas">rebuild</button>
      </div>
      <div id="atlas-body">
        <aside id="atlas-rail" aria-label="Recurring themes"></aside>
        <div id="atlas-stage">
          <canvas id="atlas-map"></canvas>
          <div id="atlas-note">
            brightness — how many books a passage's neighbors span
          </div>
          <div id="atlas-tip" hidden></div>
        </div>
        <aside id="atlas-panel" hidden aria-label="Theme detail"></aside>
      </div>
    </section>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
